name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'public/**'
      - 'src/**'
      - 'tsconfig.json'
      - 'vite.shared.ts'
      - 'vite.web.config.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: >-
        ${{ steps.deployment.outcome == 'success' && steps.deployment.outputs.page_url
        || steps.deployment_retry.outcome == 'success' && steps.deployment_retry.outputs.page_url
        || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web viewer
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait 5 seconds before retrying
        id: deployment_retry_delay
        if: ${{ !cancelled() && steps.deployment.outcome == 'failure' }}
        run: sleep 5

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: ${{ steps.deployment_retry_delay.outcome == 'success' }}
        uses: actions/deploy-pages@v5
